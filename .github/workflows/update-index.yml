name: Update F-Droid Index

on:
  push:
    branches: [ main ]
    paths:
      - 'repo/**.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned F-Droid tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "androguard==3.4.0a1" "fdroidserver==2.2.1"
          fdroid --version

      - name: Verify APK signatures before F-Droid update
        run: |
          set -e
          for apk in repo/*.apk; do
            echo "Checking $apk"
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk"
          done

      - name: Run fdroid update
        run: fdroid update --verbose

      - name: Commit updated index
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add repo/ archive/ metadata/ || true

          if git diff --cached --quiet; then
            echo "Index unchanged, nothing to commit."
          else
            git commit -m "chore: regenerate F-Droid index"
            git push
          fi
